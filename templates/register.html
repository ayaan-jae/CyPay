{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="form-page">
    <h2>Create Identity</h2>
    <p class="subtitle">Register your biometric identity on CyPay's zero-trust platform.</p>
    <form method="POST" class="card">
        <div class="form-group"><label>Full Name</label><input name="name" required placeholder="n4cr0t1c"></div>
        <div class="form-group"><label>Date of Birth</label><input name="dob" type="date" required></div>
        <div class="form-group"><label>Sex</label>
            <select name="sex" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>
        <div class="form-group"><label>SRN (Student Registration Number)</label><input name="srn" required
                placeholder="R23DC049"></div>
        <button type="submit" class="btn btn-primary"
            style="width:100%;justify-content:center;margin-top:.5rem">Continue to Face Enrollment →</button>
    </form>
</div>
{% endblock %}

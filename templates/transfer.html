{% extends "base.html" %}{% block title %}Transfer{% endblock %}
{% block content %}
<div class="form-page">
    <h2>Send Funds</h2>
    <p class="subtitle">Balance: <strong style="color:var(--accent)">₹{{ "%.2f"|format(user.balance) }}</strong></p>
    <form method="POST" class="card">
        <div class="form-group"><label>Recipient SRN</label><input name="to_srn" required placeholder="R23DC050"></div>
        <div class="form-group"><label>Amount (₹)</label><input name="amount" type="number" step="0.01" min="1" max="{{ user.balance }}" required placeholder="100"></div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem">Transfer Securely</button>
    </form>
    <p style="text-align:center;margin-top:1rem;color:var(--text2);font-size:.8rem">Every transaction is scored by the Risk Engine and logged in the forensic ledger.</p>
</div>
{% endblock %}
